<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام طلبات البرمجيات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --light-bg: #f3f4f6;
            --card-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-dark);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.95;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            background: var(--light-bg);
        }

        .tab-button {
            flex: 1;
            padding: 18px;
            background: none;
            border: none;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-light);
            transition: all 0.3s ease;
            text-decoration: none;
            position: relative;
        }

        .tab-button:hover {
            color: var(--primary-color);
            background: rgba(37, 99, 235, 0.05);
        }

        .tab-button.active {
            color: white;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }

        .tabs-content {
            padding: 40px;
            min-height: 500px;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-in;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-dark);
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: all 0.3s ease;
            background: white;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .phone-input-group {
            display: flex;
            gap: 10px;
        }

        .phone-input-group input:first-child {
            width: 80px;
        }

        .phone-input-group input:last-child {
            flex: 1;
        }

        button {
            padding: 14px 35px;
            border: none;
            border-radius: 8px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            width: 100%;
            padding: 16px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }

        .admin-section {
            max-width: 100%;
        }

        .passcode-input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .passcode-toggle {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-light);
            font-size: 1.2em;
        }

        .passcode-input-wrapper input {
            padding-right: 50px;
        }

        .message {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            animation: slideIn 0.3s ease-in;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border: 2px solid var(--success-color);
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger-color);
            border: 2px solid var(--danger-color);
        }

        @keyframes slideIn {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .request-card {
            background: var(--light-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            animation: slideIn 0.3s ease-in;
        }

        .request-card:hover {
            box-shadow: var(--card-shadow);
            border-color: var(--primary-color);
        }

        .request-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .request-card-title {
            font-size: 1.4em;
            font-weight: 700;
            color: var(--primary-color);
        }

        .request-card-date {
            font-size: 0.9em;
            color: var(--text-light);
        }

        .request-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }

        .info-item {
            background: white;
            padding: 12px;
            border-radius: 6px;
            border-right: 4px solid var(--primary-color);
        }

        .info-label {
            font-size: 0.85em;
            color: var(--text-light);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.1em;
            font-weight: 600;
            color: var(--text-dark);
        }

        .phone-highlight {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: 700;
            text-align: center;
            margin-top: 15px;
            border: 3px solid var(--warning-color);
        }

        .description-box {
            background: white;
            padding: 15px;
            border-radius: 6px;
            border-right: 4px solid var(--secondary-color);
            margin-top: 15px;
        }

        .description-label {
            font-size: 0.85em;
            color: var(--text-light);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .description-text {
            color: var(--text-dark);
            line-height: 1.6;
            word-break: break-word;
        }

        .no-requests {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }

        .no-requests-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .no-requests h3 {
            font-size: 1.3em;
            margin-bottom: 8px;
        }

        .admin-info {
            background: rgba(37, 99, 235, 0.05);
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: center;
            color: var(--primary-color);
            font-weight: 600;
        }

        .requests-list {
            display: grid;
            gap: 20px;
        }

        .delete-btn {
            background: var(--danger-color);
            color: white;
            padding: 8px 15px;
            font-size: 0.9em;
            width: auto;
            margin-top: 15px;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .admin-passcode-form {
            max-width: 500px;
            margin: 0 auto;
        }

        .requests-counter {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.2em;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .tabs {
                flex-direction: column;
            }

            .tab-button {
                border-bottom: 2px solid var(--border-color);
            }

            .tab-button.active {
                border-bottom: 2px solid var(--primary-color);
            }

            .tabs-content {
                padding: 25px;
                min-height: auto;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .request-info {
                grid-template-columns: 1fr;
            }

            .request-card-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .request-card-date {
                margin-top: 10px;
            }

            input, textarea, select {
                font-size: 16px;
            }
        }

        .success-animation {
            animation: successPulse 0.6s ease-out;
        }

        @keyframes successPulse {
            0% {
                transform: scale(0.95);
                opacity: 0;
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 نظام طلبات البرمجيات</h1>
            <p>قدّم طلبك الآن واحصل على حل برمجي احترافي</p>
        </div>

        <div class="tabs">
            <button class="tab-button active" data-tab="request-form">
                📝 تقديم طلب جديد
            </button>
            <button class="tab-button" data-tab="admin-panel">
                🔐 لوحة الإدارة
            </button>
        </div>

        <div class="tabs-content">
            <!-- قسم تقديم الطلب -->
            <div id="request-form" class="tab-content active">
                <div id="success-message"></div>
                <form id="requestForm">
                    <div class="form-group">
                        <label for="appName">اسم التطبيق المراد إنشاؤه *</label>
                        <input type="text" id="appName" name="appName" placeholder="مثال: نظام إدارة المتجر" required>
                    </div>

                    <div class="form-group">
                        <label for="appDescription">وصف التطبيق الشامل والمهام المطلوبة *</label>
                        <textarea id="appDescription" name="appDescription" placeholder="اشرح بالتفصيل ما تريده من التطبيق والميزات والمهام المطلوبة..." required></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="appType">نوع التطبيق *</label>
                            <select id="appType" name="appType" required>
                                <option value="">اختر نوع التطبيق</option>
                                <option value="موقع ويب">موقع ويب</option>
                                <option value="تطبيق Android">تطبيق Android</option>
                                <option value="تطبيق iOS">تطبيق iOS</option>
                                <option value="Android و iOS">تطبيق Android و iOS</option>
                                <option value="برنامج كمبيوتر">برنامج كمبيوتر عادي</option>
                                <option value="متعدد المنصات">متعدد المنصات</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="technology">لغة البرمجة/التقنية المفضلة</label>
                            <input type="text" id="technology" name="technology" placeholder="مثال: React, Python, Flutter...">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="budget">الميزانية/السعر بالدولار ($) *</label>
                            <input type="number" id="budget" name="budget" placeholder="1000" min="0" step="1" required>
                        </div>

                        <div class="form-group">
                            <label for="country">البلد *</label>
                            <input type="text" id="country" name="country" placeholder="مثال: السعودية" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phone">رقم الهاتف مع رمز الدولة *</label>
                        <div class="phone-input-group">
                            <input type="text" id="countryCode" name="countryCode" placeholder="+966" maxlength="5" required>
                            <input type="tel" id="phone" name="phone" placeholder="501234567" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">إرسال الطلب</button>
                </form>
            </div>

            <!-- قسم لوحة الإدارة -->
            <div id="admin-panel" class="tab-content">
                <div class="admin-section">
                    <div class="admin-info">
                        ⚠️ هذا القسم محمي برمز سري
                    </div>

                    <!-- نموذج إدخال الرمز السري -->
                    <div id="passcode-form" class="admin-passcode-form">
                        <div class="form-group">
                            <label>أدخل رمز الدخول</label>
                            <div class="passcode-input-wrapper">
                                <input type="password" id="adminPasscode" placeholder="••••••" autocomplete="off">
                                <span class="passcode-toggle" id="togglePasscode">👁️</span>
                            </div>
                        </div>
                        <button type="button" class="btn-primary" id="adminSubmit">دخول</button>
                    </div>

                    <!-- محتوى لوحة الإدارة (مخفي في البداية) -->
                    <div id="admin-content" style="display: none;">
                        <div style="margin-bottom: 20px;">
                            <button type="button" class="btn-primary" id="logoutBtn">🚪 تسجيل الخروج</button>
                        </div>
                        <div class="requests-counter">
                            📊 عدد الطلبيات: <span id="requestsCount">0</span>
                        </div>
                        <div id="requestsList" class="requests-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== البيانات في الذاكرة فقط (بدون localStorage) ====================
        let allRequests = [];

        // ==================== التبويبات ====================
        const tabButtons = document.querySelectorAll('.tab-button');
        const tabContents = document.querySelectorAll('.tab-content');

        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                const tabName = button.getAttribute('data-tab');
                
                tabButtons.forEach(btn => btn.classList.remove('active'));
                tabContents.forEach(content => content.classList.remove('active'));
                
                button.classList.add('active');
                document.getElementById(tabName).classList.add('active');
            });
        });

        // ==================== نموذج الطلب ====================
        const requestForm = document.getElementById('requestForm');
        const successMessage = document.getElementById('success-message');

        requestForm.addEventListener('submit', function (e) {
            e.preventDefault();

            const formData = {
                id: Date.now(),
                appName: document.getElementById('appName').value.trim(),
                appDescription: document.getElementById('appDescription').value.trim(),
                appType: document.getElementById('appType').value,
                technology: document.getElementById('technology').value.trim(),
                budget: document.getElementById('budget').value,
                country: document.getElementById('country').value.trim(),
                countryCode: document.getElementById('countryCode').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                timestamp: new Date().toLocaleString('ar-SA')
            };

            // حفظ الطلب في الذاكرة
            allRequests.push(formData);

            // إظهار رسالة نجاح
            successMessage.innerHTML = `
                <div class="message success success-animation">
                    ✅ تم استقبال طلبك بنجاح! سيتم التواصل معك قريباً على الرقم: ${formData.countryCode}${formData.phone}
                </div>
            `;

            // تنظيف النموذج
            requestForm.reset();

            // إخفاء الرسالة بعد 5 ثوان
            setTimeout(() => {
                successMessage.innerHTML = '';
            }, 5000);
        });

        // ==================== لوحة الإدارة ====================
        const adminPasscode = 'admin123'; // الرمز السري الافتراضي
        const adminSubmitBtn = document.getElementById('adminSubmit');
        const adminPasscodeInput = document.getElementById('adminPasscode');
        const passcodeForm = document.getElementById('passcode-form');
        const adminContent = document.getElementById('admin-content');
        const logoutBtn = document.getElementById('logoutBtn');
        const requestsList = document.getElementById('requestsList');
        const requestsCount = document.getElementById('requestsCount');
        const togglePasscode = document.getElementById('togglePasscode');

        // إظهار/إخفاء الرمز السري
        togglePasscode.addEventListener('click', () => {
            const input = document.getElementById('adminPasscode');
            if (input.type === 'password') {
                input.type = 'text';
                togglePasscode.textContent = '🙈';
            } else {
                input.type = 'password';
                togglePasscode.textContent = '👁️';
            }
        });

        // التحقق من الرمز السري
        adminSubmitBtn.addEventListener('click', () => {
            if (adminPasscodeInput.value === adminPasscode) {
                passcodeForm.style.display = 'none';
                adminContent.style.display = 'block';
                displayRequests();
            } else {
                alert('❌ الرمز السري غير صحيح!');
                adminPasscodeInput.value = '';
            }
        });

        // السماح بالدخول عند الضغط على Enter
        adminPasscodeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                adminSubmitBtn.click();
            }
        });

        // تسجيل الخروج
        logoutBtn.addEventListener('click', () => {
            passcodeForm.style.display = 'block';
            adminContent.style.display = 'none';
            adminPasscodeInput.value = '';
            requestsList.innerHTML = '';
        });

        // عرض الطلبيات
        function displayRequests() {
            requestsCount.textContent = allRequests.length;

            if (allRequests.length === 0) {
                requestsList.innerHTML = `
                    <div class="no-requests">
                        <div class="no-requests-icon">📭</div>
                        <h3>لا توجد طلبيات حالياً</h3>
                        <p>سيظهر كل الطلبيات المرسلة من المستخدمين هنا</p>
                    </div>
                `;
                return;
            }

            requestsList.innerHTML = allRequests.map(request => `
                <div class="request-card">
                    <div class="request-card-header">
                        <div class="request-card-title">🎯 ${request.appName}</div>
                        <div class="request-card-date">📅 ${request.timestamp}</div>
                    </div>

                    <div class="request-info">
                        <div class="info-item">
                            <div class="info-label">نوع التطبيق</div>
                            <div class="info-value">${request.appType}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">البلد</div>
                            <div class="info-value">${request.country}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">التقنية المفضلة</div>
                            <div class="info-value">${request.technology || 'لم يتم تحديدها'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">الميزانية</div>
                            <div class="info-value">💰 $${request.budget}</div>
                        </div>
                    </div>

                    <div class="phone-highlight">
                        ☎️ ${request.countryCode}${request.phone}
                    </div>

                    <div class="description-box">
                        <div class="description-label">وصف التطبيق</div>
                        <div class="description-text">${request.appDescription}</div>
                    </div>

                    <button type="button" class="delete-btn" onclick="deleteRequest(${request.id})">🗑️ حذف الطلب</button>
                </div>
            `).join('');
        }

        // حذف طلب
        function deleteRequest(id) {
            if (confirm('هل تريد حذف هذا الطلب؟')) {
                allRequests = allRequests.filter(req => req.id !== id);
                displayRequests();
                alert('✅ تم حذف الطلب بنجاح');
            }
        }
    </script>
</body>
</html>
